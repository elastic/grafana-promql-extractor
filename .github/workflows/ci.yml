name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # The corpus tests are compiled but never run in CI: they download
      # dashboards from grafana.com, which is not this project's to spend.
      - name: Vet
        run: |
          go vet -tags=integration ./...
          go vet -tags=corpus ./...
          go vet -tags="integration corpus" ./...

      - name: Test
        run: go test -race -timeout 5m ./...

  integration:
    name: Integration tests (Grafana ${{ matrix.grafana }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One release per major line the tool supports, plus latest to catch API
        # drift: the last before dashboards could be read a page at a time, the
        # one that introduced it, and the current one.
        grafana:
          - "11.6.6"
          - "12.4.0"
          - "13.0.1"
          - "latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        env:
          GRAFANA_IMAGE: grafana/grafana:${{ matrix.grafana }}
        # Skip analyze: it boots Elasticsearch and is covered by the dedicated job.
        run: go test -tags=integration -timeout 15m -v -skip '^TestAnalyze' ./integration/

  analyze:
    name: Integration tests (Elasticsearch analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Analyze integration tests
        run: go test -tags=integration -timeout 15m -v -run '^TestAnalyze' ./integration/

  scale:
    name: Scale test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract 50k dashboards
        env:
          EXTRACTOR_SCALE_DASHBOARDS: "50000"
        run: go test -timeout 15m -v -run TestScale ./internal/cli/

  build:
    name: Cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: build --snapshot --clean
