// Prometheus Remote-Write 1.0 wire format.
// https://prometheus.io/docs/specs/prw/remote_write_spec/
syntax = "proto3";

package remotewrite.v1;

option go_package = "github.com/elastic/grafana-promql-extractor/internal/remotewrite/v1;remotewritev1";

message WriteRequest {
  repeated TimeSeries timeseries = 1;
  reserved 2;
  reserved 3;
}

message TimeSeries {
  repeated Label labels = 1;
  repeated Sample samples = 2;
}

message Label {
  string name = 1;
  string value = 2;
}

message Sample {
  double value = 1;
  int64 timestamp = 2;
}
